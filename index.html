<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能排班系統 - N更約束融合版</title>
    <style>
        :root { --bg: #f0f4f8; --card-bg: #ffffff; --primary: #3b82f6; --danger: #ef4444; --text: #1e293b; --border: #e2e8f0; --radius: 16px; --shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; background: var(--bg); padding: 16px; }
        .container { max-width: 780px; margin: 0 auto; }
        h1 { text-align: center; font-size: 1.8em; font-weight: 700; background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 24px; }
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        label { font-weight: 600; display: block; margin-bottom: 8px; color: var(--text); }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .row > * { flex: 1 1 100px; }
        input, select, textarea { font-family: inherit; font-size: 0.9em; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #f8fafc; width: 100%; }
        button { font-family: inherit; font-weight: 600; font-size: 0.95em; padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer; background: var(--primary); color: white; white-space: nowrap; }
        button:hover { background: #2563eb; } button:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-danger { background: var(--danger); } .btn-success { background: #16a34a; } .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .demand-row { display: flex; flex-wrap: wrap; gap: 16px; }
        .demand-group { flex: 1 1 220px; background: #f8fafc; border-radius: 12px; padding: 14px; border: 1px solid var(--border); }
        .demand-group h4 { text-align: center; margin-bottom: 10px; }
        .demand-item { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        .demand-item span:first-child { min-width: 32px; }
        .demand-item input { width: 62px; text-align: center; padding: 6px 4px; border-radius: 8px; font-size: 0.85em; }
        .n-rule-group { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 14px; margin-top: 12px; }
        .status { text-align: center; margin: 15px 0; font-weight: 500; background: #f1f5f9; padding: 10px; border-radius: 10px; }
        .table-container { overflow-x: auto; margin: 20px 0; border-radius: 12px; box-shadow: var(--shadow); }
        table { border-collapse: collapse; width: 100%; min-width: 1500px; font-size: 0.8em; white-space: nowrap; }
        th, td { border: 1px solid #e2e8f0; padding: 6px 3px; text-align: center; }
        th { background: #f1f5f9; position: sticky; top: 0; z-index: 2; }
        .person-col { background: #f8fafc; font-weight: 700; min-width: 70px; position: sticky; left: 0; z-index: 1; }
        .weekend { background-color: #fce4e4; } .rest { color: #94a3b8; }
        .shift-A { background: #d1fae5; color: #065f46; } .shift-B { background: #dbeafe; color: #1e3a8a; } .shift-C { background: #fef3c7; color: #92400e; } .shift-D { background: #ede9fe; color: #5b21b6; } .shift-N { background: #ffe4e6; color: #9f1239; font-weight: 600; }
        .conflict { background: #ffcccc !important; color: #b91c1c !important; font-weight: bold; }
        .summary { background: var(--card-bg); border-radius: var(--radius); padding: 20px; margin-top: 20px; }
        .check-ok { color: #16a34a; font-weight: 600; } .check-fail { color: #dc2626; font-weight: 600; }
        .constraint-cell { cursor: pointer; user-select: none; } .constraint-cell:hover { filter: brightness(0.95); }
        .leave-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
        .warning-badge { background: #fff3cd; color: #856404; padding: 6px 10px; border-radius: 20px; font-size: 0.8em; margin-left: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📅 排班表 · 智能N更協同版</h1>
    <p class="subtitle">條件表手動N更 ➕ 自動滿足每日人數｜硬約束連續上班｜N更規則強制連休</p>

    <div class="card">
        <label>⚙️ 每更人數範圍（A~D 更）</label>
        <div class="demand-row">
            <div class="demand-group"><h4>平日</h4>
                <div class="demand-item"><span>A更</span><input type="number" id="wdAMin" value="6"><span>~</span><input type="number" id="wdAMax" value="7"></div>
                <div class="demand-item"><span>B更</span><input type="number" id="wdBMin" value="6"><span>~</span><input type="number" id="wdBMax" value="7"></div>
                <div class="demand-item"><span>C更</span><input type="number" id="wdCMin" value="6"><span>~</span><input type="number" id="wdCMax" value="7"></div>
                <div class="demand-item"><span>D更</span><input type="number" id="wdDMin" value="5"><span>~</span><input type="number" id="wdDMax" value="6"></div>
            </div>
            <div class="demand-group"><h4>假日</h4>
                <div class="demand-item"><span>A更</span><input type="number" id="weAMin" value="5"><span>~</span><input type="number" id="weAMax" value="6"></div>
                <div class="demand-item"><span>B更</span><input type="number" id="weBMin" value="3"><span>~</span><input type="number" id="weBMax" value="4"></div>
                <div class="demand-item"><span>C更</span><input type="number" id="weCMin" value="4"><span>~</span><input type="number" id="weCMax" value="5"></div>
                <div class="demand-item"><span>D更</span><input type="number" id="weDMin" value="0"><span>~</span><input type="number" id="weDMax" value="2"></div>
            </div>
        </div>
        <button onclick="updateDemand()" style="margin-top:12px;">🔄 更新需求</button>
        <small>N更人數由下方「N更輪班規則」中的「每日人數選項」統一控制。</small>
    </div>

    <div class="card">
        <label>🔄 N更輪班規則 (手動N更塊長度＆強制休息必須與此一致)</label>
        <div class="n-rule-group">
            <div class="row">
                <div><label>每日人數</label><input type="number" id="nDailyNeed" value="3" min="1"></div>
                <div><label>連續上班</label><input type="number" id="nWorkDays" value="3" min="1"></div>
                <div><label>強制休息</label><input type="number" id="nRestDays" value="2" min="0"></div>
            </div>
            <small>⚠️ 條件表中手動點擊[N]會自動生成連續工作塊+強制休息，長度＝上述連續上班/強制休息。修改規則後請重新生成或清理舊N更條件，避免長度不符。</small>
        </div>
    </div>

    <div class="card">
        <div class="row">
            <div style="flex:1;"><label>📏 每人最多連續上班天數（硬約束）</label><input type="number" id="maxConsecutiveDays" value="4" min="1"></div>
            <div style="flex:1;"><label>📊 每人每月最多休息天數（硬約束）</label><input type="number" id="maxRestDays" value="10" min="0"></div>
        </div>
    </div>

    <div class="card">
        <div class="row">
            <div style="flex:1;"><label>👥 總人數</label><input type="number" id="totalPeople" value="39" onchange="onTotalChange()"></div>
            <div style="flex:1;"><label>📆 排班年月</label><select id="yearSelect" onchange="changeMonth()"></select><select id="monthSelect" onchange="changeMonth()"></select></div>
        </div>
        <button onclick="changeMonth()" style="margin-top:8px; width:100%;">✅ 更新月份</button>
    </div>

    <div class="card"><label for="nameInput">👤 員工姓名（一行一個）</label><textarea id="nameInput" rows="8" placeholder="一人一行，預設會自動填滿"></textarea><small>目前人數：<span id="nameCount">39</span>（需與總人數一致）</small></div>

    <div class="card" style="display: none;">
        <label>📌 設定員工請假</label>
        <div class="row"><select id="leavePerson"><option value="">--選擇員工--</option></select><input type="date" id="leaveStart"><input type="date" id="leaveEnd"><button onclick="addLeave()">➕ 新增</button></div>
        <div id="leaveList" class="leave-list"></div>
    </div>

    <div class="card">
        <label>📋 條件表（點擊切換：無限制 → 休 → A → B → C → D → N）</label>
        <button onclick="clearConstraints()" class="btn-outline" style="margin-bottom:10px;">🗑️ 清除所有條件</button>
        <div id="constraint-table" class="table-container"></div>
    </div>

    <div style="text-align: center; margin: 20px 0;">
        <button id="generateBtn" onclick="generateSchedule()" style="font-size:1.1em; padding:12px 24px;">🔄 生成班表（自動融合手動N更環境）</button>
        <button id="downloadBtn" onclick="downloadCSV()" class="btn-success" style="font-size:1.1em; padding:12px 24px;" disabled>⬇️ 下載 CSV</button>
    </div>
    <div id="status" class="status"></div>
    <div id="schedule-output" class="table-container"></div>
    <div id="summary" class="summary"></div>
</div>

<script>
    const SHIFT_NAMES = ['休', 'A', 'B', 'C', 'D', 'N'];
    const SHIFT_MAP = Object.fromEntries(SHIFT_NAMES.map((n,i)=>[n,i]));

    let WEEKDAY_MIN = [0,6,6,6,5,0]; let WEEKDAY_MAX = [0,7,7,7,6,0];
    let WEEKEND_MIN = [0,5,3,4,0,0]; let WEEKEND_MAX = [0,6,4,5,2,0];
    let NUM_PEOPLE = 39;
    
    // 【修改核心】：自動獲取「下一個月」作為預設排班年月
    const targetDate = new Date();
    targetDate.setMonth(targetDate.getMonth() + 1); // 往前推一個月
    let currentYear = targetDate.getFullYear();
    let currentMonth = targetDate.getMonth() + 1; // JavaScript 月份為 0~11，故需 +1

    let monthData = null, leaveEntries = [];
    let currentSchedule = null, currentNames = null;
    let constraintMatrix = [];

    function updateDemand() {
        const g = id => parseInt(document.getElementById(id).value)||0;
        WEEKDAY_MIN = [0,g('wdAMin'),g('wdBMin'),g('wdCMin'),g('wdDMin'),0];
        WEEKDAY_MAX = [0,g('wdAMax'),g('wdBMax'),g('wdCMax'),g('wdDMax'),0];
        WEEKEND_MIN = [0,g('weAMin'),g('weBMin'),g('weCMin'),g('weDMin'),0];
        WEEKEND_MAX = [0,g('weAMax'),g('weBMax'),g('weCMax'),g('weDMax'),0];
        clearOutput();
    }

    function clearOutput() {
        document.getElementById('schedule-output').innerHTML = '';
        document.getElementById('summary').innerHTML = '';
        currentSchedule = null; currentNames = null;
        document.getElementById('downloadBtn').disabled = true;
    }

    function getDaysInMonth(y,m) {
        const date = new Date(y, m, 0);
        const numDays = date.getDate();
        const days = [], isHoliday = [];
        for (let d=1; d<=numDays; d++) {
            const cur = new Date(y, m-1, d);
            days.push(cur);
            isHoliday.push(cur.getDay()===0 || cur.getDay()===6);
        }
        return {days, isHoliday, numDays};
    }

    function updateMonthData() {
        monthData = getDaysInMonth(currentYear, currentMonth);
        
        const formatYMD = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const minStr = formatYMD(currentYear, currentMonth, 1);
        const maxStr = formatYMD(currentYear, currentMonth, monthData.numDays);
        
        document.getElementById('leaveStart').min = minStr;
        document.getElementById('leaveStart').max = maxStr;
        document.getElementById('leaveEnd').min = minStr;
        document.getElementById('leaveEnd').max = maxStr;
        
        leaveEntries = leaveEntries.map(e => ({...e, ...clipLeave(e.rawStart, e.rawEnd)})).filter(e => e.startDay!==null);
        renderLeaveList();
        initConstraintMatrix();
        renderConstraintTable();
        clearOutput();
    }

    function clipLeave(startStr, endStr) {
        const s = new Date(startStr+'T00:00:00'), e = new Date(endStr+'T00:00:00');
        const mf = new Date(currentYear,currentMonth-1,1), ml = new Date(currentYear,currentMonth-1,monthData.numDays);
        if(s>ml || e<mf) return {startDay:null, endDay:null};
        const cs = s<mf ? mf : s, ce = e>ml ? ml : e;
        return {startDay:cs.getDate(), endDay:ce.getDate()};
    }

    function onTotalChange() {
        let val = parseInt(document.getElementById('totalPeople').value);
        if(isNaN(val) || val < 1) return;
        NUM_PEOPLE = val;
        initDefaultNames();
        leaveEntries=[]; renderLeaveList();
        initConstraintMatrix(); renderConstraintTable();
        clearOutput();
    }

    function initYearMonthSelectors() {
        const ys = document.getElementById('yearSelect'), ms = document.getElementById('monthSelect');
        ys.innerHTML=''; ms.innerHTML='';
        for(let y=2020; y<=2035; y++) ys.add(new Option(y+'年', y));
        for(let m=1; m<=12; m++) ms.add(new Option(m+'月', m));
        
        ys.value = currentYear;
        ms.value = currentMonth;
        
        updateMonthData();
    }

    async function changeMonth() {
        currentYear = +document.getElementById('yearSelect').value;
        currentMonth = +document.getElementById('monthSelect').value;
        updateMonthData();
        
        document.getElementById('status').innerHTML = `⏳ 已切換至 ${currentYear}年${currentMonth}月，正在自動重新生成班表...`;
        await new Promise(r=>setTimeout(r,50));
        generateSchedule();
    }

    function updateNameCount() {
        const lines = document.getElementById('nameInput').value.trim().split('\n').filter(s=>s.trim());
        document.getElementById('nameCount').textContent = lines.length;
        updateLeavePersonSelect();
        if(lines.length===NUM_PEOPLE && monthData) renderConstraintTable();
    }
    function initDefaultNames() {
        document.getElementById('nameInput').value = Array.from({length:NUM_PEOPLE}, (_,i)=>`員工${String(i+1).padStart(2,'0')}`).join('\n');
        updateNameCount();
    }
    function getNames() {
        const lines = document.getElementById('nameInput').value.trim().split('\n').filter(s=>s.trim());
        if(lines.length !== NUM_PEOPLE) {
            document.getElementById('status').innerHTML = `❌ 姓名數量(${lines.length})與總人數(${NUM_PEOPLE})不符`;
            return null;
        }
        return lines;
    }
    document.getElementById('nameInput').addEventListener('input', updateNameCount);
    function updateLeavePersonSelect() {
        const names = getNames();
        const sel = document.getElementById('leavePerson');
        sel.innerHTML = '<option value="">--選擇員工--</option>';
        if(names) names.forEach((n,i)=> sel.add(new Option(n, i)));
    }

    function addLeave() {
        const idx = +document.getElementById('leavePerson').value;
        const s = document.getElementById('leaveStart').value, e = document.getElementById('leaveEnd').value;
        if(isNaN(idx) || !s || !e) return alert('請輸入完整');
        const {startDay, endDay} = clipLeave(s,e);
        if(!startDay) return alert('日期不在本月');
        leaveEntries.push({personIndex:idx, startDay, endDay, rawStart:s, rawEnd:e});
        renderLeaveList();
        document.getElementById('leaveStart').value=''; document.getElementById('leaveEnd').value='';
    }
    function removeLeave(i) { leaveEntries.splice(i,1); renderLeaveList(); }
    function renderLeaveList() {
        const cont = document.getElementById('leaveList');
        if(!leaveEntries.length) { cont.innerHTML='<p style="color:#94a3b8;">尚未設定請假</p>'; return; }
        const names = getNames() || [];
        cont.innerHTML = leaveEntries.map((e,i) => {
            const name = names[e.personIndex] || `員工${e.personIndex+1}`;
            return `<div class="leave-item"><span><b>${name}</b>：${e.rawStart}~${e.rawEnd} (本月${e.startDay}-${e.endDay})</span><button class="btn-danger" onclick="removeLeave(${i})">刪除</button></div>`;
        }).join('');
    }
    function buildLeaveSets() {
        const leaves = Array.from({length:NUM_PEOPLE}, ()=>new Set());
        leaveEntries.forEach(e => { for(let d=e.startDay; d<=e.endDay; d++) leaves[e.personIndex].add(d-1); });
        return leaves;
    }

    function initConstraintMatrix() {
        if(!monthData) return;
        constraintMatrix = Array.from({length:NUM_PEOPLE}, ()=>new Array(monthData.numDays).fill(null));
    }
    function renderConstraintTable() {
        const container = document.getElementById('constraint-table');
        if(!monthData) return;
        const names = getNames() || [];
        const numDays = monthData.numDays, days = monthData.days;
        let html = '<table><thead><tr><th class="person-col">姓名</th>';
        for(let d=0; d<numDays; d++) html += `<th class="${monthData.isHoliday[d]?'weekend':''}">${days[d].getDate()}<br>週${'日一二三四五六'[days[d].getDay()]}</th>`;
        html += '</tr></thead><tbody>';
        for(let p=0; p<NUM_PEOPLE; p++) {
            html += `<tr><td class="person-col">${names[p]}</td>`;
            for(let d=0; d<numDays; d++) {
                const val = constraintMatrix[p][d];
                const text = val===null?'':SHIFT_NAMES[val];
                const cls = val===null?'':(val===0?'rest':`shift-${SHIFT_NAMES[val]}`);
                html += `<td class="constraint-cell ${cls}" onclick="cycleConstraint(${p},${d})">${text}</td>`;
            }
            html += '</tr>';
        }
        html += '</tbody></table>';
        container.innerHTML = html;
    }
    function cycleConstraint(p, d) {
        const work = parseInt(document.getElementById('nWorkDays').value) || 3;
        const rest = parseInt(document.getElementById('nRestDays').value) || 2;
        const numDays = monthData.numDays;
        let val = constraintMatrix[p][d];
        if (val === null) {
            constraintMatrix[p][d] = 0;
        } else if (val === 0) {
            constraintMatrix[p][d] = 1;
        } else if (val === 1) constraintMatrix[p][d] = 2;
        else if (val === 2) constraintMatrix[p][d] = 3;
        else if (val === 3) constraintMatrix[p][d] = 4;
        else if (val === 4) constraintMatrix[p][d] = 5;
        else if (val === 5) {
            let start = d;
            while (start > 0 && constraintMatrix[p][start-1] === 5) start--;
            let endN = start;
            while (endN < numDays && constraintMatrix[p][endN] === 5) endN++;
            endN--;
            for (let i = start; i <= endN; i++) constraintMatrix[p][i] = null;
            let restStart = endN + 1;
            let restEnd = Math.min(restStart + rest, numDays - 1);
            for (let i = restStart; i <= restEnd; i++) {
                if (constraintMatrix[p][i] === 0) constraintMatrix[p][i] = null;
            }
            renderConstraintTable();
            return;
        }
        if (constraintMatrix[p][d] === 5) {
            for (let i = 0; i < work && (d + i) < numDays; i++) constraintMatrix[p][d + i] = 5;
            for (let i = work; i < work + rest && (d + i) < numDays; i++) constraintMatrix[p][d + i] = 0;
        }
        renderConstraintTable();
    }
    function clearConstraints() {
        if(confirm('確定清除所有條件嗎？')) { initConstraintMatrix(); renderConstraintTable(); }
    }
    function buildFixedFromConstraints() {
        if(!monthData) return null;
        const fixed = Array.from({length:NUM_PEOPLE}, ()=>new Array(monthData.numDays).fill(-1));
        let has = false;
        for(let p=0; p<NUM_PEOPLE; p++) for(let d=0; d<monthData.numDays; d++) {
            if(constraintMatrix[p][d]!==null) { fixed[p][d]=constraintMatrix[p][d]; has=true; }
        }
        return has ? fixed : null;
    }

    function generateNPattern(leaves, fixed) {
        const need = +document.getElementById('nDailyNeed').value || 3;
        const work = +document.getElementById('nWorkDays').value || 3;
        const rest = +document.getElementById('nRestDays').value || 2;
        const numDays = monthData.numDays;

        WEEKDAY_MIN[5] = need; WEEKDAY_MAX[5] = need;
        WEEKEND_MIN[5] = need; WEEKEND_MAX[5] = need;

        const manualNCount = new Array(numDays).fill(0);
        for (let d = 0; d < numDays; d++) {
            for (let p = 0; p < NUM_PEOPLE; p++) {
                if (constraintMatrix[p][d] === 5) manualNCount[d]++;
            }
        }

        const lockedN = Array.from({length: NUM_PEOPLE}, () => new Array(numDays).fill(false));
        const lockedRest = Array.from({length: NUM_PEOPLE}, () => new Set());
        for (let p = 0; p < NUM_PEOPLE; p++) {
            for (let d = 0; d < numDays; d++) {
                if (constraintMatrix[p][d] === 5) lockedN[p][d] = true;
                if (constraintMatrix[p][d] === 0 || leaves[p].has(d)) lockedRest[p].add(d);
            }
        }

        for (let p = 0; p < NUM_PEOPLE; p++) {
            let d = 0;
            while (d < numDays) {
                if (lockedN[p][d]) {
                    let start = d;
                    let len = 0;
                    while (d < numDays && lockedN[p][d]) { len++; d++; }
                    if (len !== work) {
                        document.getElementById('status').innerHTML = `❌ 員工 ${getNames()[p] || p+1} 的手動N更塊長度為 ${len} 天，與當前N更規則「連續上班${work}天」不符！請清理或調整後重試。`;
                        return null;
                    }
                } else d++;
            }
        }

        const existingBlocks = [];
        for (let p = 0; p < NUM_PEOPLE; p++) {
            let d = 0;
            while (d < numDays) {
                if (lockedN[p][d]) {
                    let start = d;
                    while (d < numDays && lockedN[p][d]) d++;
                    existingBlocks.push({p, start, length: d - start});
                } else d++;
            }
        }

        const restBlockDays = Array.from({length: NUM_PEOPLE}, () => new Set());
        for (let p = 0; p < NUM_PEOPLE; p++) {
            for (let d of lockedRest[p]) restBlockDays[p].add(d);
            for (const block of existingBlocks.filter(b => b.p === p)) {
                const restStart = block.start + block.length;
                for (let i = restStart; i < Math.min(restStart + rest, numDays); i++) restBlockDays[p].add(i);
            }
        }

        const nMatrix = Array.from({length: NUM_PEOPLE}, () => new Array(numDays).fill(false));
        for (const block of existingBlocks) for (let i = 0; i < block.length; i++) nMatrix[block.p][block.start + i] = true;

        for (let d = 0; d < numDays; d++) {
            let currentTotal = 0;
            for (let p = 0; p < NUM_PEOPLE; p++) {
                if (nMatrix[p][d]) currentTotal++;
            }

            if (currentTotal >= need) continue;

            const needed = need - currentTotal;
            const available = [];
            for (let p = 0; p < NUM_PEOPLE; p++) {
                if (nMatrix[p][d] || restBlockDays[p].has(d)) continue;

                let lastN = -1;
                for (let i = d - 1; i >= 0; i--) {
                    if (nMatrix[p][i]) { lastN = i; break; }
                }
                if (lastN !== -1) {
                    let blockEnd = lastN + 1;
                    if (d < blockEnd + rest) continue; 
                }

                let can = true;
                for (let i = 0; i < work; i++) {
                    const fd = d + i;
                    if (fd >= numDays) break;
                    if (restBlockDays[p].has(fd) || nMatrix[p][fd]) { can = false; break; }

                    let totalOnFd = 0;
                    for (let pp = 0; pp < NUM_PEOPLE; pp++) {
                        if (nMatrix[pp][fd]) totalOnFd++;
                    }
                    if (totalOnFd >= Math.max(need, manualNCount[fd])) { can = false; break; }
                }

                if (can) available.push(p);
            }

            if (available.length < needed) {
                const date = monthData.days[d].getDate();
                document.getElementById('status').innerHTML = `❌ 員工於第 ${date} 日 N更人手調度困難（可用 ${available.length} 人，尚需 ${needed} 人）。請減少該日前後的手動限制。`;
                return null;
            }

            shuffleArray(available);
            const selected = available.slice(0, needed);
            for (const p of selected) {
                for (let i = 0; i < work && (d + i) < numDays; i++) nMatrix[p][d + i] = true;
                const restStart = d + work;
                for (let i = restStart; i < Math.min(restStart + rest, numDays); i++) restBlockDays[p].add(i);
            }
        }

        const forcedRest = Array.from({length: NUM_PEOPLE}, () => new Array(numDays).fill(false));
        for (let p = 0; p < NUM_PEOPLE; p++) for (let d = 0; d < numDays; d++) if (restBlockDays[p].has(d)) forcedRest[p][d] = true;
        return { matrix: nMatrix, forcedRest };
    }

    function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }

    function solveRoster(leaves, fixed, nMatrix, forcedRest, maxConsecutiveDays) {
        const numDays = monthData.numDays, isHoliday = monthData.isHoliday;
        let roster = Array.from({length:NUM_PEOPLE}, () => new Array(numDays).fill(0));
        if (fixed) for (let p=0; p<NUM_PEOPLE; p++) for (let d=0; d<numDays; d++) if (fixed[p][d]!==-1) roster[p][d] = fixed[p][d];
        if (nMatrix) for (let p=0; p<NUM_PEOPLE; p++) for (let d=0; d<numDays; d++) if (nMatrix[p][d]) roster[p][d] = 5;
        for (let p=0; p<NUM_PEOPLE; p++) for (let d=0; d<numDays; d++) if (forcedRest[p][d] || leaves[p].has(d)) roster[p][d] = 0;

        for (let d=0; d<numDays; d++) {
            const dMin = isHoliday[d] ? WEEKEND_MIN : WEEKDAY_MIN;
            const dMax = isHoliday[d] ? WEEKEND_MAX : WEEKDAY_MAX;
            const cnt = [0,0,0,0,0,0];
            const unfixed = [];
            for (let p=0; p<NUM_PEOPLE; p++) {
                if (roster[p][d] !== 0) cnt[roster[p][d]]++;
                else { if (forcedRest[p][d] || leaves[p].has(d)) continue; unfixed.push(p); }
            }
            const neededMin = [];
            for (let s=1; s<=4; s++) { const need = Math.max(0, dMin[s] - cnt[s]); for (let k=0; k<need; k++) neededMin.push(s); }
            const avail = unfixed.filter(p => !leaves[p].has(d));
            shuffleArray(avail);
            const selMin = avail.slice(0, neededMin.length);
            for (let i=0; i<selMin.length; i++) roster[selMin[i]][d] = neededMin[i];
            const usedSet = new Set(selMin);
            const remaining = unfixed.filter(p => !usedSet.has(p));
            const newCnt = [0,0,0,0,0,0]; for (let p=0; p<NUM_PEOPLE; p++) if (roster[p][d] !== 0) newCnt[roster[p][d]]++;
            const remainingAvail = remaining.filter(p => !leaves[p].has(d));
            shuffleArray(remainingAvail);
            let ptr = 0;
            for (let s=1; s<=4; s++) { while (newCnt[s] < dMax[s] && ptr < remainingAvail.length) { roster[remainingAvail[ptr]][d] = s; newCnt[s]++; ptr++; } }
            for (let i=ptr; i<remainingAvail.length; i++) roster[remainingAvail[i]][d] = 0;
        }

        const maxRest = parseInt(document.getElementById('maxRestDays').value)||10;
        function calcConflicts(sched) {
            let total = 0, restViolations = 0, consViolations = 0;
            for (let p=0; p<NUM_PEOPLE; p++) {
                let cons = 0;
                for (let d=0; d<numDays; d++) {
                    if (sched[p][d] !== 0) { cons++; if (cons > maxConsecutiveDays) { total += (cons - maxConsecutiveDays) * 50; consViolations++; } }
                    else cons = 0;
                }
                const restDays = sched[p].filter(v => v===0).length;
                if (restDays > maxRest) { const excess = restDays - maxRest; total += excess * 100; restViolations += excess; }
            }
            return { total, restViolations, consViolations };
        }
        function delta(p1,p2,d,sched) {
            const o1 = sched[p1][d], o2 = sched[p2][d]; if (o1 === o2) return 0;
            if (nMatrix && (nMatrix[p1][d] || nMatrix[p2][d])) return 0;
            if (fixed && (fixed[p1][d]!==-1 || fixed[p2][d]!==-1)) return 0;
            if (forcedRest[p1][d] || forcedRest[p2][d]) return 0;
            sched[p1][d] = o2; sched[p2][d] = o1;
            const nc = calcConflicts(sched).total;
            sched[p1][d] = o1; sched[p2][d] = o2;
            return nc - calcConflicts(sched).total;
        }
        let schedule = roster, conflictInfo = calcConflicts(schedule), conflict = conflictInfo.total;
        const start = Date.now();
        for (let iter=0; iter<300000; iter++) {
            if (conflict === 0 || Date.now() - start > 20000) break;
            const p1 = Math.floor(Math.random() * NUM_PEOPLE);
            const d = Math.floor(Math.random() * numDays);
            let p2; do { p2 = Math.floor(Math.random() * NUM_PEOPLE); } while (p2 === p1);
            if (nMatrix && (nMatrix[p1][d] || nMatrix[p2][d])) continue;
            if (fixed && (fixed[p1][d]!==-1 || fixed[p2][d]!==-1)) continue;
            if (forcedRest[p1][d] || forcedRest[p2][d]) continue;
            if (leaves[p1].has(d) || leaves[p2].has(d)) continue;
            const dlt = delta(p1,p2,d,schedule);
            if (dlt <= 0 || Math.random() < 0.01) { [schedule[p1][d], schedule[p2][d]] = [schedule[p2][d], schedule[p1][d]]; conflict += dlt; }
        }
        const finalInfo = calcConflicts(schedule);
        const success = finalInfo.consViolations === 0 && finalInfo.restViolations === 0;
        return { success, schedule, conflict: finalInfo.total, consViolations: finalInfo.consViolations, restViolations: finalInfo.restViolations };
    }

    function displaySchedule(schedule, names, leaves, conflictSet=null, maxConsecutiveDays=4) { 
        const numDays = monthData.numDays, days = monthData.days, isHoliday = monthData.isHoliday;
        const maxRest = parseInt(document.getElementById('maxRestDays').value)||10;
        if (!conflictSet) { conflictSet = new Set();
            for (let p=0; p<NUM_PEOPLE; p++) for (let d=0; d<numDays; d++) if (leaves[p].has(d) && schedule[p][d]!==0) conflictSet.add(`${p},${d}`);
            for (let p=0; p<NUM_PEOPLE; p++) { let c=0, cs=-1; for (let d=0; d<numDays; d++) { if (schedule[p][d]!==0) { c++; if(c===1) cs=d; } else { c=0; cs=-1; } if (c > maxConsecutiveDays) { for(let i=cs; i<=d; i++) conflictSet.add(`${p},${i}`); c=0; cs=-1; } } if (schedule[p].filter(v=>v===0).length > maxRest) for (let d=0; d<numDays; d++) if (schedule[p][d]===0) conflictSet.add(`${p},${d}`); }
            for (let d=0; d<numDays; d++) { 
                const dMin=isHoliday[d]?WEEKEND_MIN:WEEKDAY_MIN, dMax=isHoliday[d]?WEEKEND_MAX:WEEKDAY_MAX; 
                const cnt=[0,0,0,0,0,0]; 
                for(let p=0;p<NUM_PEOPLE;p++) cnt[schedule[p][d]]++; 
                
                let dayManualN = 0;
                for(let pp=0; pp<NUM_PEOPLE; pp++) if(constraintMatrix[pp][d] === 5) dayManualN++;
                const currentNMin = Math.max(dMin[5], dayManualN);
                const currentNMax = Math.max(dMax[5], dayManualN);

                for (let s=1; s<=5; s++) { 
                    let minL = dMin[s], maxL = dMax[s];
                    if (s === 5) { minL = currentNMin; maxL = currentNMax; }
                    if(cnt[s]<minL||cnt[s]>maxL) for(let p=0;p<NUM_PEOPLE;p++) if(schedule[p][d]===s) conflictSet.add(`${p},${d}`); 
                } 
            } 
        }
        let html = '<table><thead><tr><th class="person-col">姓名</th>'; for (let d=0; d<numDays; d++) html += `<th class="${isHoliday[d]?'weekend':''}">${days[d].getDate()}<br>週${'日一二三四五六'[days[d].getDay()]}</th>`; html += '</tr></thead><tbody>';
        for (let p=0; p<NUM_PEOPLE; p++) { html += `<tr><td class="person-col">${names[p]}</td>`; for (let d=0; d<numDays; d++) { const s=schedule[p][d], sn=SHIFT_NAMES[s]; let cls = s===0?'rest':`shift-${SHIFT_NAMES[s]}`; if(isHoliday[d]) cls+=' weekend'; if(conflictSet.has(`${p},${d}`)) cls+=' conflict'; html += `<td class="${cls}">${sn}</td>`; } html += '</tr>'; } html += '</tbody></table>';
        document.getElementById('schedule-output').innerHTML = html;
        document.getElementById('summary').innerHTML = `<h2>📊 檢查結果</h2><p>N更每日基準人數 = ${document.getElementById('nDailyNeed').value} ，個別日期已完美優先融合手動超額設定。</p>`;
    }

    function downloadCSV() { if(!currentSchedule||!currentNames) { alert('請先生成班表'); return; } const numDays=monthData.numDays, days=monthData.days; let csv='\uFEFF姓名'; for(let d=0;d<numDays;d++) csv+=`,${days[d].getDate()}日(週${'日一二三四五六'[days[d].getDay()]})`; csv+='\n'; for(let p=0;p<NUM_PEOPLE;p++) { let row=currentNames[p]; for(let d=0;d<numDays;d++) row+=`,${SHIFT_NAMES[currentSchedule[p][d]]}`; csv+=row+'\n'; } const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}), url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=`排班表_${currentYear}_${currentMonth}.csv`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }

    async function generateSchedule() {
        if(!monthData) return; updateDemand();
        const maxConsecutiveDays = parseInt(document.getElementById('maxConsecutiveDays').value) || 4;
        const names = getNames(); if(!names) return;
        const leaves = buildLeaveSets();
        const fixed = buildFixedFromConstraints();
        const nResult = generateNPattern(leaves, fixed);
        if (!nResult) return;
        const { matrix: nMatrix, forcedRest } = nResult;
        document.getElementById('status').innerHTML = '⏳ 計算中 (動態預檢並融合手動N更)...';
        const btn = document.getElementById('generateBtn'); btn.disabled = true; btn.textContent = '計算中...';
        await new Promise(r=>setTimeout(r,50));
        let result = null;
        for(let i=1; i<=5; i++) { result = solveRoster(leaves, fixed, nMatrix, forcedRest, maxConsecutiveDays); if(result.success) break; await new Promise(r=>setTimeout(r,50)); }
        btn.disabled = false; btn.textContent = '🔄 生成班表（自動融合手動N更）';
        if(result && result.success) { document.getElementById('status').innerHTML = '✅ 生成成功！手動N更與員工休息上限均已完美滿足。'; displaySchedule(result.schedule, names, leaves, null, maxConsecutiveDays); currentSchedule = result.schedule; currentNames = names; document.getElementById('downloadBtn').disabled = false; } 
        else { document.getElementById('status').innerHTML = '❌ 無法滿足全部硬約束（如連續上班或每月最多休息天數超標），請嘗試放寬限制或調整手動條件。'; }
    }

    window.onload = function() { NUM_PEOPLE = parseInt(document.getElementById('totalPeople').value); updateDemand(); initYearMonthSelectors(); initDefaultNames(); generateSchedule(); };
</script>
